[project]
name = "ops"
version = "0.2.0"
description = "DevOps Agent — Dual-Loop Convergence Architecture (Correctness + Availability)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["libs/agent", "libs/devops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
